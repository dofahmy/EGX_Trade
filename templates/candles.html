{% extends 'base.html' %}
{% block title %}الشموع{% endblock %}
{% block body %}
<style>
main{max-width:none}
.cv{display:flex;flex-direction:row-reverse;gap:14px;align-items:flex-start}
.cv-chart{flex:1;min-width:0}
.cv-side{width:300px;flex-shrink:0;position:sticky;top:10px}
.cv-list{max-height:calc(100vh - 150px);overflow-y:auto;border-top:1px solid var(--line)}
.cv-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 8px;border-bottom:1px solid var(--line);cursor:pointer}
.cv-row:hover{background:#f3f5f9}
.cv-row.on{background:#e8eefb;outline:1px solid var(--blue)}
.cv-row .s{font-weight:700;font-size:14px}
.cv-row .n{font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.cv-row .p{text-align:left;font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
.cv-row .sg{display:inline-block;font-size:10px;background:#e3edfb;color:#1f5fbf;border-radius:4px;padding:0 4px;margin-top:2px}
#cv-q{width:100%;margin-bottom:8px}
.lg{display:inline-flex;align-items:center;gap:5px}
.mk{border-radius:10px;padding:10px 12px;margin:0 0 10px;font-size:14px;border:1px solid var(--line);background:#f7f8fb}
.mk.on{background:#e6f4ea;border-color:#9ccfa8}
.cv-notes p{margin:6px 0;padding:8px 10px;border-radius:8px;font-size:14px;background:#f7f8fb;border:1px solid var(--line)}
.cv-notes p.b{background:#e8f0fd;border-color:#b5cdf3}
.cv-notes p.c{background:#e6f4ea;border-color:#9ccfa8}
.cv-notes p.l{background:#fff5e0;border-color:#f0cf87}
.cv-notes p.t{background:#e6f4ea;border-color:#9ccfa8}
.kb{display:inline-block;min-width:20px;text-align:center;border-radius:10px;color:#fff;font-weight:700;font-size:12px;padding:1px 6px}
.k1{background:#1baf7a}.k2{background:#14213d}.k3{background:#2a78d6}.k4{background:#e34948}.k5{background:#e8a317}
#cv-key td,#cv-key th{padding:5px 7px;vertical-align:top;white-space:normal;word-wrap:break-word;border-bottom:1px solid var(--line);text-align:right}
#cv-key th{background:#f3f5f9}
{% if bare %}
main{padding:6px!important;margin:0!important}
.cv-side,#cv-notes,#cc-n,label.note{display:none!important}
.cv-chart.card{box-shadow:none;border:0;margin:0}
{% endif %}
@media (max-width:800px){.cv{flex-direction:column}.cv-side{width:100%;position:static}.cv-list{max-height:300px}}
</style>
<div class="cv">
  <div class="cv-chart card">
    <div style="display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px">
      <h2 style="margin:0"><span id="cv-sym"></span> <span id="cv-name" class="mute" style="font-size:15px"></span></h2>
      <div class="big" id="cv-px"></div>
    </div>
    <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:8px 0">
      <label class="note" style="flex-direction:row;align-items:center;gap:6px">الفترة <select id="cc-n"><option value="30">آخر ٣٠ جلسة</option><option value="60" selected>آخر ٦٠ جلسة</option><option value="120">آخر ١٢٠ جلسة</option><option value="9999">كل الجلسات</option></select></label>
    </div>
    <div id="cc-wrap" style="overflow-x:auto;direction:ltr"><svg id="cc"></svg></div>
    <div id="cv-notes" class="cv-notes"></div>
  </div>
  <div class="cv-side card">
    <input id="cv-q" type="search" placeholder="ابحث بالرمز أو اسم الشركة">
    <div class="note" style="margin-bottom:4px">{{ stocks|length }} سهم · جلسة {{ last_date }}</div>
    <div class="cv-list" id="cv-list">
      {% for s in stocks %}
      <div class="cv-row{{ ' on' if s.sym == sel }}" data-sym="{{ s.sym }}" data-q="{{ (s.sym ~ ' ' ~ s.name)|lower }}">
        <div style="min-width:0"><div class="s">{{ s.sym }}</div><div class="n">{{ s.name }}</div></div>
        <div class="p">{{ s.last }}<div class="{{ 'pos' if s.chg and s.chg > 0 else 'neg' if s.chg and s.chg < 0 else 'mute' }}" style="font-size:12px">{% if s.chg is not none %}{{ '%+.2f'|format(s.chg) }}٪{% endif %}</div></div>
      </div>
      {% endfor %}
    </div>
  </div>
</div>
<div id="cc-tip" style="position:fixed;display:none;background:#14213d;color:#fff;padding:6px 10px;border-radius:6px;font-size:13px;pointer-events:none;z-index:9;direction:rtl"></div>
<script>
(function(){
const NAMES = {}; document.querySelectorAll('.cv-row').forEach(r => NAMES[r.dataset.sym] = r.querySelector('.n').textContent);
const UP = '#1baf7a', DN = '#e34948', BLUE = '#2a78d6', GOLD = '#e8a317';
const NS = 'http://www.w3.org/2000/svg';
const AR = s => String(s).replace(/[0-9]/g, d => '٠١٢٣٤٥٦٧٨٩'[d]).replace(/\./g, '٫');
const SG = v => (v > 0 ? '+' : '') + v;
const DT = d => `${AR(d.slice(8))}/${AR(d.slice(5, 7))}/${AR(d.slice(0, 4))}`;
function el(t, a, p){ const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); p && p.appendChild(e); return e; }
const tip = document.getElementById('cc-tip');
function hover(e, html){
  e.addEventListener('mousemove', ev => { tip.innerHTML = html; tip.style.display = 'block'; tip.style.left = (ev.clientX + 14) + 'px'; tip.style.top = (ev.clientY + 12) + 'px'; });
  e.addEventListener('mouseleave', () => tip.style.display = 'none');
}
let ALL = [];
const HOLD = 10;
const ACT = {1: ['شراء', '#1baf7a'], 2: ['خروج', '#14213d'], 3: ['راقب', '#2a78d6'], 4: ['حذر', '#e34948'], 5: ['حد', '#e8a317'], 6: ['كمّل', '#0d6b49'], 7: ['ما كمّلش', '#888780']};
function actions(A){
  A.forEach(d => { d.acts = (d.buy && d.cluster) ? [{k: 1}] : []; });
  return [];
}
let TRADES = [];
const MARK = {{ (mark or '')|tojson }};
function draw(){
  let n = +document.getElementById('cc-n').value;
  if (MARK){ const k = ALL.findIndex(d => d.d === MARK); if (k >= 0 && ALL.length - k > n - 10) n = Math.min(ALL.length, ALL.length - k + 30); }
  const D = ALL.slice(-n);
  const svg = document.getElementById('cc'); svg.innerHTML = '';
  notes(D);
  if (!D.length){ svg.setAttribute('height', 40); return; }
  const wrapW = document.getElementById('cc-wrap').clientWidth || 800;
  const PADL = 92, PADT = 16, H1 = 380, GAP = 34, H2 = 110, H3 = 110, PB = 26;
  const H = PADT + H1 + 10 + GAP + H2 + GAP + H3 + PB;
  const step = Math.max(5, Math.min(60, (wrapW - PADL - 20) / D.length));
  const W = PADL + step * D.length + 20;
  svg.setAttribute('width', W); svg.setAttribute('height', H);
  const LO = d => Math.max(d.l, Math.min(d.o, d.c) * 0.8), HI = d => Math.min(d.h, Math.max(d.o, d.c) * 1.25);
  let lo = Math.min(...D.map(LO)), hi = Math.max(...D.map(HI));
  const pad = (hi - lo) * 0.06 || hi * 0.01; lo -= pad; hi += pad;
  const y = v => PADT + (hi - v) / (hi - lo) * H1;
  const BOT = 10;   // مساحة تحت الشموع لكلمة «حذر»
  for (let i = 0; i <= 5; i++){
    const v = lo + (hi - lo) * i / 5, yy = y(v);
    el('line', {x1: PADL, x2: W - 10, y1: yy, y2: yy, stroke: '#eef0f4'}, svg);
    el('text', {x: PADL - 6, y: yy + 4, 'text-anchor': 'end', 'font-size': 11, fill: '#6b7385'}, svg).textContent = +v.toPrecision(4);
  }
  // لوحة السوق
  const T2 = PADT + H1 + BOT + GAP, mid = T2 + H2 / 2;
  const mx = Math.max(12, ...D.map(d => Math.abs(d.net)));
  const yb = v => mid - v / mx * (H2 / 2 - 4);
  el('line', {x1: PADL, x2: W - 10, y1: mid, y2: mid, stroke: '#c9ccd4'}, svg);
  el('line', {x1: PADL, x2: W - 10, y1: yb(10), y2: yb(10), stroke: '#1baf7a', 'stroke-dasharray': '4 3'}, svg);
  el('text', {x: PADL - 6, y: yb(10) + 4, 'text-anchor': 'end', 'font-size': 10, fill: '#0d6b49'}, svg).textContent = '١٠';
  el('text', {x: PADL - 6, y: T2 - 8, 'text-anchor': 'end', 'font-size': 11, 'font-weight': 700, fill: '#1d2433'}, svg).textContent = 'السوق';
  el('text', {x: PADL - 6, y: T2 + 6, 'text-anchor': 'end', 'font-size': 10, fill: '#6b7385'}, svg).textContent = 'مشتري − بياع';
  // لوحة السهم: كمية ساعته الأولى قصاد الجلسة اللي قبلها (فوق لو المشتري أكتر، تحت لو البياع أكتر)
  const T3 = T2 + H2 + GAP, mid3 = T3 + H3 / 2, CAP = 3;
  const y3 = v => mid3 - Math.max(-CAP, Math.min(CAP, v)) / CAP * (H3 / 2 - 4);
  el('line', {x1: PADL, x2: W - 10, y1: mid3, y2: mid3, stroke: '#c9ccd4'}, svg);
  [1, -1].forEach(v => el('line', {x1: PADL, x2: W - 10, y1: y3(v), y2: y3(v), stroke: v > 0 ? '#1baf7a' : '#e34948', 'stroke-dasharray': '4 3'}, svg));
  el('text', {x: PADL - 6, y: y3(1) + 4, 'text-anchor': 'end', 'font-size': 10, fill: '#0d6b49'}, svg).textContent = '١×';
  el('text', {x: PADL - 6, y: y3(-1) + 4, 'text-anchor': 'end', 'font-size': 10, fill: '#b3261e'}, svg).textContent = '١×';
  el('text', {x: PADL - 6, y: T3 - 8, 'text-anchor': 'end', 'font-size': 11, 'font-weight': 700, fill: '#1d2433'}, svg).textContent = 'السهم';
  el('text', {x: PADL - 6, y: T3 + 6, 'text-anchor': 'end', 'font-size': 10, fill: '#6b7385'}, svg).textContent = 'الساعة الأولى';
  
  const every = Math.ceil(40 / step), bw = Math.max(2, step * 0.6);
  D.forEach((d, i) => {
    const x = PADL + step * i + step / 2;
    const up = d.c >= d.o, c = up ? UP : DN;
    el('line', {x1: x, x2: x, y1: y(HI(d)), y2: y(LO(d)), stroke: c, 'stroke-width': 1.3}, svg);
    const top = y(Math.max(d.o, d.c)), hh = Math.max(1.5, Math.abs(y(d.o) - y(d.c)));
    el('rect', {x: x - bw / 2, y: top, width: bw, height: hh, fill: c}, svg);
    // لوحة الصافي
    const nt = d.net, top2 = nt >= 0 ? yb(nt) : mid;
    el('rect', {x: x - bw / 2, y: top2, width: bw, height: Math.max(1, Math.abs(yb(nt) - mid)), fill: nt >= 10 ? UP : nt > 0 ? '#9fc3ee' : '#f3b3b2'}, svg);
    // لوحة السهم
    if (d.h1x != null && d.bsh != null){
      const up3 = d.bsh >= 0.5, v = up3 ? d.h1x : -d.h1x;
      const fill3 = d.buy ? UP : d.sell ? DN : up3 ? '#bfe3d2' : '#f6c9c8';
      const t3 = Math.min(y3(v), mid3);
      el('rect', {x: x - bw / 2, y: t3, width: bw, height: Math.max(1, Math.abs(y3(v) - mid3)), fill: fill3}, svg);
    }
    let h = `<b>${d.d}</b><br>افتتاح ${d.o} · إغلاق ${d.c} (${SG(d.chg)}٪)<br>أدنى ${d.l} · أعلى ${d.h}`;
    if (d.bsh != null) h += `<br>الساعة الأولى: المشتري ${Math.round(d.bsh * 100)}٪` + (d.h1x != null ? ` · الكمية ${d.h1x.toFixed(1)}× الجلسة اللي قبلها` : '');
    if (!d.mh1) h += '<br><span style="color:#f3b3b2">بيانات الساعة الأولى مش موجودة للجلسة دي</span>';
    if (MARK && d.d === MARK){
      el('line', {x1: x, x2: x, y1: PADT - 4, y2: H - PB, stroke: '#6b46c1', 'stroke-width': 2, 'stroke-dasharray': '6 4'}, svg);
      const yl = Math.min(y(LO(d)) + 14, PADT + H1 - 4);
      el('path', {d: `M${x} ${yl} l-8 14 h16 z`, fill: '#6b46c1'}, svg);
      const anc = x > W - 90 ? 'end' : x < PADL + 60 ? 'start' : 'middle';
      const lb = el('text', {x: anc === 'end' ? x + 6 : x, y: Math.min(yl + 30, PADT + H1 + 8), 'text-anchor': anc, 'font-size': 13, 'font-weight': 800, fill: '#6b46c1'}, svg);
      lb.textContent = 'إشارة شراء ' + d.d.slice(5);
      h += '<br><b style="color:#c9b6f2">آخر إشارة شراء</b>';
    }
    const hit = el('rect', {x: x - step / 2, y: PADT - 20, width: step, height: H - PADT - PB + 20, fill: 'transparent'}, svg);
    hover(hit, h);
    const lastLbl = D.length - 1;
    if (i === lastLbl || (i % every === 0 && lastLbl - i >= every))
      el('text', {x: x, y: H - 8, 'text-anchor': 'middle', 'font-size': 11, fill: '#1d2433'}, svg).textContent = d.d.slice(5);
  });
  document.getElementById('cc-wrap').scrollLeft = 1e9;
}
function notes(D){ document.getElementById('cv-notes').innerHTML = ''; }
const px = document.getElementById('cv-px');
let token = 0;
async function load(sym, push){
  const my = ++token;
  document.getElementById('cv-sym').textContent = sym;
  document.getElementById('cv-name').textContent = NAMES[sym] || '';
  document.querySelectorAll('.cv-row').forEach(r => r.classList.toggle('on', r.dataset.sym === sym));
  px.innerHTML = '<span class="mute" style="font-size:14px">جاري التحميل…</span>';
  document.getElementById('cc-wrap').style.opacity = .35;
  if (push){ const u = new URL(location); u.searchParams.set('sym', sym); history.replaceState(null, '', u); }
  const m = new URLSearchParams(location.search).get('m') || 'egx';
  let data = null, err = '';
  try {
    const res = await fetch(`{{ url_for('candles_data', sym='__S__') }}`.replace('__S__', encodeURIComponent(sym)) + '?m=' + m, {credentials: 'same-origin'});
    if (!res.ok) throw new Error('السيرفر رد بخطأ ' + res.status);
    data = (await res.json()).data || [];
  } catch (e) { err = e.message || String(e); }
  if (my !== token) return;
  document.getElementById('cc-wrap').style.opacity = 1;
  if (data === null){
    ALL = []; TRADES = []; draw();
    px.innerHTML = `<span class="neg" style="font-size:14px">تعذر تحميل الرسم: ${err}</span>`;
    return;
  }
  ALL = data; TRADES = actions(ALL);
  const L = ALL[ALL.length - 1];
  px.innerHTML = L ? `${L.c} <span class="${L.chg > 0 ? 'pos' : L.chg < 0 ? 'neg' : 'mute'}" style="font-size:14px">${SG(L.chg)}٪</span>` : '<span class="mute" style="font-size:14px">لا توجد بيانات</span>';
  draw();
}
document.getElementById('cv-list').addEventListener('click', e => { const r = e.target.closest('.cv-row'); if (r) load(r.dataset.sym, true); });
document.getElementById('cv-q').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll('.cv-row').forEach(r => r.style.display = !q || r.dataset.q.includes(q) ? '' : 'none');
});
document.getElementById('cc-n').addEventListener('change', draw);
window.addEventListener('resize', draw);
{% if sel %}load({{ sel|tojson }}, false);{% endif %}
const on = document.querySelector('.cv-row.on'); if (on) on.scrollIntoView({block: 'center'});
})();
</script>
{% endblock %}
