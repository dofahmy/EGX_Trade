{% extends 'base.html' %}
{% block title %}إشارات إيجابية على الأسهم{% endblock %}
{% block body %}
<style>

h1{font-size:20px;margin:0 0 6px}
.note{color:#5b6475;font-size:13px;line-height:1.8;margin:0 0 10px}
.bar{display:flex;flex-wrap:wrap;gap:16px;align-items:center;background:#fff;border:1px solid #e3e6ec;border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:14px}
.bar label{display:inline-flex!important;flex-direction:row!important;align-items:center;gap:6px;margin:0;font-weight:400}
.bar input[type=checkbox]{width:auto!important;margin:0}
.bar input[type=text]{padding:6px 10px;border:1px solid #cfd4dd;border-radius:6px;width:110px;direction:ltr}
.sum{color:#5b6475;font-size:13px;width:100%}
.tbl{background:#fff;border:1px solid #e3e6ec;border-radius:10px;display:block}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:14px;font-variant-numeric:tabular-nums}
th{position:sticky;top:0;background:#eef1f5;font-weight:600;font-size:13px;color:#4a5263;cursor:pointer;white-space:nowrap}
th,td{padding:7px 12px;border-bottom:1px solid #eef0f3;text-align:right;white-space:nowrap}
th.on::after{content:" ▾"} th.on.asc::after{content:" ▴"}
.pos{color:#0f7b4d;font-weight:700}.neg{color:#c0392b;font-weight:700}
.mute{color:#8a92a3;font-size:12px}
.sym{font-weight:700;direction:ltr;unicode-bidi:isolate}
tr.bm td{background:#b9e8cb}
.tag.s80{background:#b7791f}
.tag{display:inline-block;font-size:11px;background:#2b6cb0;color:#fff;border-radius:4px;padding:0 5px;margin-right:6px}
</style>
<h1>إشارات إيجابية على الأسهم</h1>
<p class="note"><span style="background:#b9e8cb;padding:0 6px;border-radius:4px;font-weight:700">أخضر</span> = السوق كله بيعمل قاع</p>
<div class="bar">
 <label><input type="checkbox" id="st"> القوية بس</label>
 <label><input type="checkbox" id="s8"> دبل شرا بس</label>
 <label><input type="checkbox" id="liq" checked> سيولة ٥٠٠ ألف جنيه أو أكتر</label>
 <label>السهم <input type="text" id="q" placeholder="PRMH"></label>
 <label>السنة <select id="yr"><option value="">الكل</option></select></label>
 <span class="sum" id="sum"></span>
</div>
<div class="tbl"><table><thead><tr>
<th data-k="d">الإشارة</th><th data-k="s">السهم</th><th data-k="c">سعر الشرا</th><th data-k="h40">أعلى سعر خلال ٤٠ جلسة</th><th data-k="l40">أقل سعر خلال ٤٠ جلسة</th><th data-k="r40">بعد ٤٠ جلسة</th><th data-k="nr">السعر دلوقتي</th>
</tr></thead><tbody id="tb"></tbody></table></div>
<script>
const D={{ rows|tojson }};
const BM={{ bm|tojson }};
const AR=s=>String(s).replace(/[0-9]/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]).replace(/\./g,'٫');
const DT=s=>s?AR(s.slice(8,10)+'/'+s.slice(5,7)+'/'+s.slice(0,4)):'—';
const ys=document.getElementById('yr'); [...new Set(D.map(r=>r.d.slice(0,4)))].sort().reverse().forEach(y=>{const o=document.createElement('option');o.value=y;o.textContent=AR(y);ys.appendChild(o);});
let key='d',asc=false;
function pct(v){if(v==null)return '—'; if(Math.abs(v)<0.05)return '<span class="mute">‎٠٪</span>'; return '<span class="'+(v>0?'pos':'neg')+'">‎'+(v>0?'+':'')+AR(v.toFixed(1))+'٪</span>';}
function med(a){a=a.slice().sort((x,y)=>x-y);return a.length?a[Math.floor(a.length/2)]:null;}
function draw(){
  const st=document.getElementById('st').checked, s8=document.getElementById('s8').checked, liq=document.getElementById('liq').checked, q=document.getElementById('q').value.trim().toUpperCase(), y=ys.value;
  let R=D.filter(r=>(!st||r.st)&&(!s8||r.s80)&&(!liq||r.liq)&&(!q||r.s.includes(q))&&(!y||r.d.startsWith(y)));
  R.sort((a,b)=>{let x=a[key],z=b[key]; if(x==null)return 1; if(z==null)return -1; return (x>z?1:x<z?-1:0)*(asc?1:-1);});
  document.querySelectorAll('th').forEach(t=>{t.classList.toggle('on',t.dataset.k===key);t.classList.toggle('asc',t.dataset.k===key&&asc);});
  const done=R.filter(r=>r.n40>=40);
  const up=done.filter(r=>r.r40>0).length, t10=done.filter(r=>r.h40>=10).length;
  document.getElementById('sum').innerHTML=AR(R.length)+' إشارة'+(done.length?' · من اللي كمّلوا ٤٠ جلسة ('+AR(done.length)+'): قفلوا كسبانين '+AR(Math.round(up*100/done.length))+'٪ · لمسوا +١٠٪ '+AR(Math.round(t10*100/done.length))+'٪':'');
  document.getElementById('tb').innerHTML=R.map(r=>{
    const bm=BM[r.d]?'bm':'';
    const lnk='/candles?m=egx&sym='+encodeURIComponent(r.s)+'&bare=1&mark='+r.d;
    const hi=r.hp40==null?'<span class="mute">لسه النهارده</span>':'<b>'+AR(r.hp40)+'</b> '+pct(r.h40)+' <span class="mute">بعد '+AR(r.hj)+' جلسة</span>';
    const lo=r.lp40==null?'—':AR(r.lp40)+' '+pct(r.l40);
    const af=r.cp40==null?'—':(r.n40>=40?'<b>'+AR(r.cp40)+'</b> '+pct(r.r40):'<span class="mute">لسه '+AR(r.n40)+' جلسة</span>');
    const now='<b>'+AR(r.np_)+'</b> '+pct(r.nr);
    return '<tr class="'+bm+'"><td>'+DT(r.d)+'</td><td class="sym"><a href="'+lnk+'">'+r.s+'</a>'+(r.s80?' <span class="tag s80">دبل شرا</span>':'')+(r.st?' <span class="tag">قوية</span>':'')+'</td><td>'+AR(r.c)+'</td><td>'+hi+'</td><td>'+lo+'</td><td>'+af+'</td><td>'+now+'</td></tr>';
  }).join('');
}
document.querySelectorAll('th').forEach(t=>t.onclick=()=>{if(key===t.dataset.k)asc=!asc;else{key=t.dataset.k;asc=false;}draw();});
['st','s8','liq','q','yr'].forEach(i=>document.getElementById(i).addEventListener('input',draw));
draw();
</script>
{% endblock %}
