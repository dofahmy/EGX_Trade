<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}إشارات المستويات{% endblock %}</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1d2433;--mute:#6b7385;--line:#e4e7ee;--green:#0f7b4d;--greenbg:#e6f4ec;--red:#b42318;--redbg:#fdecea;--amber:#9a6200;--amberbg:#fff4dc;--blue:#1f4fb5}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6}
header{background:#14213d;color:#fff;padding:14px 22px;display:flex;justify-content:space-between;align-items:center}
header a{color:#fff;text-decoration:none;font-weight:600}
main{max-width:1150px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:18px}
h1,h2,h3{margin:0 0 12px}
h2{font-size:19px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{background:#f0f2f6;font-weight:600;color:#3a4256}
td.num{font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
.pill{display:inline-block;padding:2px 10px;border-radius:20px;font-size:13px;font-weight:600}
.buy{background:var(--greenbg);color:var(--green)}
.armed{background:var(--amberbg);color:var(--amber)}
.idle{background:#eef0f4;color:var(--mute)}
.pos{color:var(--green);font-weight:600}
.neg{color:var(--red);font-weight:600}
.mute{color:var(--mute)}
.big{font-size:17px}
form.inline{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
label{display:flex;flex-direction:column;font-size:13px;color:var(--mute);gap:4px}
input{padding:7px 9px;border:1px solid #cfd4de;border-radius:7px;font-size:14px;font-family:inherit}
input[type=number]{width:90px}
button{background:var(--blue);color:#fff;border:0;border-radius:7px;padding:8px 16px;font-size:14px;cursor:pointer;font-family:inherit}
button.danger{background:none;color:var(--red);padding:0;font-size:13px}
.banner{border-radius:10px;padding:16px 18px;margin-bottom:18px;font-size:16px}
.banner.buy{border:1px solid #b7e0c8}
.banner.armed{border:1px solid #f1d79a}
.banner.idle{border:1px solid var(--line)}
a{color:var(--blue)}
.note{font-size:13px;color:var(--mute)}
</style>
</head>
<body>
<header>
  <div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">
    <a href="{{ murl('index') }}">إشارات المستويات</a>
    {% for k, v in markets.items() %}
      <a href="{{ url_for('index', m=k) }}" style="font-weight:{{ 700 if k==mkt else 400 }};opacity:{{ 1 if k==mkt else 0.65 }};padding:4px 10px;border-radius:6px;{{ 'background:rgba(255,255,255,.14);' if k==mkt }}">{{ v.title }}</a>
    {% endfor %}
  </div>
  <span class="mute" style="color:#c9d1e6;font-size:13px">قراءة لشكل التداول، مش توصية بشراء أو بيع</span>
</header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
