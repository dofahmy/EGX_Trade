{% extends 'base.html' %}
{% block title %}{{ name }}{% endblock %}
{% block body %}
<style>main{max-width:none;padding:8px}</style>
<h2 style="margin:4px 0 6px">{{ name }} <span class="mute" style="font-size:14px">{{ sym }} · {{ tfname }} · بتوقيت القاهرة</span></h2>
<div id="wrap" style="direction:ltr;overflow-x:auto"><svg id="ch"></svg></div>
<div id="tip" style="position:fixed;display:none;background:#14213d;color:#fff;padding:6px 10px;border-radius:6px;font-size:13px;pointer-events:none;z-index:9;direction:rtl"></div>
<script>
(function(){
const D = {{ data|tojson }}, MARK = {{ (mark or '')|tojson }};
const NS = 'http://www.w3.org/2000/svg', UP = '#1baf7a', DN = '#e34948';
const AR = s => String(s).replace(/[0-9]/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
function el(t, a, p){ const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); p && p.appendChild(e); return e; }
const tip = document.getElementById('tip');
function draw(){
  const svg = document.getElementById('ch'); svg.innerHTML = '';
  if (!D.length){ svg.setAttribute('height', 40); return; }
  const Wd = document.getElementById('wrap').clientWidth || 1000;
  const PADL = 70, PADT = 10, H1 = 380, GAP = 30, H2 = 170, PB = 26, H = PADT + H1 + GAP + H2 + PB;
  const step = Math.max(4, (Wd - PADL - 20) / D.length), W = PADL + step * D.length + 20;
  svg.setAttribute('width', W); svg.setAttribute('height', H);
  let lo = Math.min(...D.map(d => d.l)), hi = Math.max(...D.map(d => d.h)); const pad = (hi - lo) * .05; lo -= pad; hi += pad;
  const y = v => PADT + (hi - v) / (hi - lo) * H1;
  for (let i = 0; i <= 5; i++){ const v = lo + (hi - lo) * i / 5; el('line', {x1: PADL, x2: W - 10, y1: y(v), y2: y(v), stroke: '#eef0f4'}, svg);
    el('text', {x: PADL - 6, y: y(v) + 4, 'text-anchor': 'end', 'font-size': 11, fill: '#6b7385'}, svg).textContent = +v.toPrecision(5); }
  const T2 = PADT + H1 + GAP, CL = 300, y2 = v => T2 + (CL - Math.max(-CL, Math.min(CL, v))) / (2 * CL) * H2;
  [100, 0, -100].forEach(v => el('line', {x1: PADL, x2: W - 10, y1: y2(v), y2: y2(v), stroke: v ? '#9aa3b5' : '#d5d9e2', 'stroke-dasharray': v ? '4 3' : ''}, svg));
  [100, -100].forEach(v => el('text', {x: PADL - 6, y: y2(v) + 4, 'text-anchor': 'end', 'font-size': 10, fill: '#6b7385'}, svg).textContent = v);
  el('rect', {x: PADL, y: y2(100), width: W - 10 - PADL, height: y2(-100) - y2(100), fill: 'rgba(33,150,243,.06)'}, svg);
  el('text', {x: PADL - 6, y: T2 - 6, 'text-anchor': 'end', 'font-size': 11, 'font-weight': 700, fill: '#1d2433'}, svg).textContent = 'CCI ٢٠';
  const bw = Math.max(1.5, step * .6), every = Math.ceil(70 / step);
  let pc = '', pm = '';
  const mi = MARK ? D.findIndex(d => d.t >= MARK) : -1;
  D.forEach((d, i) => {
    const x = PADL + step * i + step / 2, c = d.c >= d.o ? UP : DN;
    el('line', {x1: x, x2: x, y1: y(d.h), y2: y(d.l), stroke: c}, svg);
    el('rect', {x: x - bw / 2, y: y(Math.max(d.o, d.c)), width: bw, height: Math.max(1, Math.abs(y(d.o) - y(d.c))), fill: c}, svg);
    if (d.cci != null) pc += (pc ? 'L' : 'M') + x + ' ' + y2(d.cci);
    if (d.m != null) pm += (pm ? 'L' : 'M') + x + ' ' + y2(d.m);
    if (i === mi){
      el('line', {x1: x, x2: x, y1: PADT, y2: H - PB, stroke: '#6b46c1', 'stroke-width': 2, 'stroke-dasharray': '6 4'}, svg);
      const yl = Math.min(y(d.l) + 12, PADT + H1 - 4);
      el('path', {d: `M${x} ${yl} l-8 14 h16 z`, fill: '#6b46c1'}, svg);
      const anc = x > W - 120 ? 'end' : x < PADL + 80 ? 'start' : 'middle';
      el('text', {x: x, y: Math.min(yl + 30, PADT + H1 + 10), 'text-anchor': anc, 'font-size': 13, 'font-weight': 800, fill: '#6b46c1', direction: 'rtl'}, svg).textContent = 'إشارة شراء ' + AR(d.t.length > 10 ? d.t.slice(5).replace('-', '/') : d.t.slice(8) + '/' + d.t.slice(5, 7) + '/' + d.t.slice(0, 4));
    }
    const hit = el('rect', {x: x - step / 2, y: PADT, width: step, height: H - PADT - PB, fill: 'transparent'}, svg);
    hit.addEventListener('mousemove', ev => { tip.innerHTML = `<b>${d.t}</b><br>افتتاح ${d.o} · إغلاق ${d.c}<br>أدنى ${d.l} · أعلى ${d.h}<br>CCI ${d.cci != null ? d.cci.toFixed(0) : '—'} · الأصفر ${d.m != null ? d.m.toFixed(0) : '—'}`; tip.style.display = 'block'; tip.style.left = (ev.clientX + 14) + 'px'; tip.style.top = (ev.clientY + 12) + 'px'; });
    hit.addEventListener('mouseleave', () => tip.style.display = 'none');
    if (i % every === 0) el('text', {x: x, y: H - 8, 'text-anchor': 'middle', 'font-size': 10, fill: '#1d2433'}, svg).textContent = (d.t.length > 10 ? d.t.slice(5, 13) : d.t.slice(2));
  });
  el('path', {d: pc, fill: 'none', stroke: '#2962FF', 'stroke-width': 1.4}, svg);
  el('path', {d: pm, fill: 'none', stroke: '#e8a317', 'stroke-width': 1.6}, svg);
}
draw(); window.addEventListener('resize', draw);
})();
</script>
{% endblock %}
