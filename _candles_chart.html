{# رسم شموع الحالة. محتاج متغير data من السيرفر #}
<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:6px 0">
  <label class="note">آخر <select id="cc-n"><option value="15">١٥ جلسة</option><option value="30" selected>٣٠ جلسة</option><option value="60">٦٠ جلسة</option><option value="9999">كله</option></select></label>
  <span class="note" style="display:flex;flex-wrap:wrap;gap:4px 14px"><span style="white-space:nowrap"><span class="lg" style="background:#D4AF37;outline:1px solid #14213d"></span>دهبية</span><span style="white-space:nowrap"><span class="lg" style="background:#2C2C2A"></span>سودا</span><span style="white-space:nowrap"><span class="lg" style="background:#D3D1C7;outline:1px solid #14213d"></span>محايدة</span><span style="white-space:nowrap"><span class="lg" style="background:#3B6D11"></span>اتحمت</span><span style="white-space:nowrap"><span class="lg" style="background:#97C459"></span>فوق دعم</span><span style="white-space:nowrap"><span class="lg" style="background:#EF9F27"></span>بتتجرب</span><span style="white-space:nowrap"><span class="lg" style="background:#E24B4A"></span>اتكسرت</span><span style="white-space:nowrap"><span class="lg" style="background:#888780"></span>مفيش دعم</span></span>
</div>
<style>.lg{display:inline-block;width:12px;height:10px;margin-left:5px;vertical-align:middle}</style>
<div id="cc-wrap" style="overflow-x:auto;direction:ltr"><svg id="cc"></svg></div>
<p class="note">عرض الشمعة = اللي اتباع عند سعر الحيطة في اليوم ده كنسبة من تداول اليوم، ومكتوب تحت التاريخ. والخط المتقطع جنب الشمعة الدهبية أو السودا هو سعر الحيطة.</p>
<div id="cc-tip" style="position:fixed;display:none;background:#14213d;color:#fff;padding:6px 10px;border-radius:6px;font-size:13px;pointer-events:none;z-index:9;direction:rtl"></div>
<script>
(function(){
const ALL = {{ data|tojson }};
const COL = {green:'#3B6D11', lightgreen:'#97C459', orange:'#EF9F27', red:'#E24B4A', gray:'#888780'};
const KIND = {gold:'#D4AF37', black:'#2C2C2A', neutral:'#D3D1C7'};
const STATE = {green:'قاعد على حيطة اتحمت', lightgreen:'ماشي فوق دعم', orange:'بيجرب حيطة', red:'كسر حيطة', gray:'مفيش دعم تحته'};
const KNAME = {gold:'شمعة دهبية', black:'شمعة سودا', neutral:'شمعة محايدة'};
const NS = 'http://www.w3.org/2000/svg';
function el(t, a, p){ const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); p && p.appendChild(e); return e; }
const tip = document.getElementById('cc-tip');
function hover(e, html){
  e.addEventListener('mousemove', ev => { tip.innerHTML = html; tip.style.display = 'block'; tip.style.left = (ev.clientX + 14) + 'px'; tip.style.top = (ev.clientY + 12) + 'px'; });
  e.addEventListener('mouseleave', () => tip.style.display = 'none');
}
function draw(){
  const n = +document.getElementById('cc-n').value, D = ALL.slice(-n);
  const svg = document.getElementById('cc'); svg.innerHTML = '';
  if (!D.length) return;
  const wrapW = document.getElementById('cc-wrap').clientWidth || 800;
  const PADL = 60, PADT = 14, H = 440, PB = 54;
  const step = Math.max(22, Math.min(70, (wrapW - PADL - 20) / D.length));
  const W = PADL + step * D.length + 20;
  svg.setAttribute('width', W); svg.setAttribute('height', H);
  let lo = Math.min(...D.map(d => d.l)), hi = Math.max(...D.map(d => d.h));
  const pad = (hi - lo) * 0.06 || hi * 0.01; lo -= pad; hi += pad;
  const y = v => PADT + (hi - v) / (hi - lo) * (H - PADT - PB);
  for (let i = 0; i <= 6; i++){
    const v = lo + (hi - lo) * i / 6, yy = y(v);
    el('line', {x1: PADL, x2: W - 10, y1: yy, y2: yy, stroke: '#eef0f4'}, svg);
    el('text', {x: PADL - 6, y: yy + 4, 'text-anchor': 'end', 'font-size': 11, fill: '#6b7385'}, svg).textContent = +v.toPrecision(4);
  }
  const every = Math.ceil(30 / step);
  D.forEach((d, i) => {
    const x = PADL + step * i + step / 2;
    const special = d.kind;
    const c = special ? KIND[d.kind] : COL[d.col];
    const w = Math.max(4, Math.min(step * 0.85, 4 + d.str / 30 * (step * 0.8)));
    const wick = (special === 'black') ? '#14213d' : c;
    el('line', {x1: x, x2: x, y1: y(d.h), y2: y(d.l), stroke: wick, 'stroke-width': 1.5}, svg);
    const top = y(Math.max(d.o, d.c)), hh = Math.max(3, Math.abs(y(d.o) - y(d.c)));
    const r = el('rect', {x: x - w / 2, y: top, width: w, height: hh, fill: c}, svg);
    if (special){ r.setAttribute('stroke', '#14213d'); r.setAttribute('stroke-width', 1.2); }
    if (special && d.wall) el('line', {x1: x - step / 2, x2: x + step / 2, y1: y(d.wall), y2: y(d.wall), stroke: '#14213d', 'stroke-dasharray': '3 2'}, svg);
    const hit = el('rect', {x: x - step / 2, y: PADT, width: step, height: H - PADT - PB, fill: 'transparent'}, svg);
    hover(hit, `<b>${d.d}</b>${special ? ' · ' + KNAME[d.kind] : ''}<br>فتح ${d.o} · إقفال ${d.c} (${d.chg > 0 ? '+' : ''}${d.chg}٪)<br>أقل ${d.l} · أعلى ${d.h}<br>${STATE[d.col]}${d.wall ? ' · الحيطة ' + d.wall : ''}<br>اتلم عند الحيطة ${d.str}٪`);
    if (i % every === 0 || i === D.length - 1)
      el('text', {x: x, y: H - PB + 18, 'text-anchor': 'middle', 'font-size': 11, fill: '#1d2433'}, svg).textContent = d.d.slice(5);
    el('text', {x: x, y: H - PB + 36, 'text-anchor': 'middle', 'font-size': 10, fill: '#6b7385'}, svg).textContent = d.str ? Math.round(d.str) : '';
  });
  document.getElementById('cc-wrap').scrollLeft = 1e9;
}
document.getElementById('cc-n').addEventListener('change', draw);
draw();
})();
</script>
